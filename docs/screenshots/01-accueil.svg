    <circle cx="0" cy="0" r="248" fill="#09101f" stroke="#1e293b" stroke-width="4"/>

    <!-- Metallic Rim with Golden Pegs -->
    <circle cx="0" cy="0" r="242" fill="url(#rimGrad)" stroke="#00f0ff" stroke-width="2"/>
    
    <!-- 8 Slices -->
    <!-- Slice 1 (Cyan) -->
    <path d="M0 0 L 235 0 A 235 235 0 0 1 166 166 Z" fill="#00f0ff" stroke="#0f172a" stroke-width="2"/>
    <!-- Slice 2 (Gold) -->
    <path d="M0 0 L 166 166 A 235 235 0 0 1 0 235 Z" fill="#f59e0b" stroke="#0f172a" stroke-width="2"/>
    <!-- Slice 3 (Emerald) -->
    <path d="M0 0 L 0 235 A 235 235 0 0 1 -166 166 Z" fill="#10b981" stroke="#0f172a" stroke-width="2"/>
    <!-- Slice 4 (Purple) -->
    <path d="M0 0 L -166 166 A 235 235 0 0 1 -235 0 Z" fill="#8b5cf6" stroke="#0f172a" stroke-width="2"/>
    <!-- Slice 5 (Pink) -->
    <path d="M0 0 L -235 0 A 235 235 0 0 1 -166 -166 Z" fill="#ec4899" stroke="#0f172a" stroke-width="2"/>
    <!-- Slice 6 (Blue) -->
    <path d="M0 0 L -166 -166 A 235 235 0 0 1 0 -235 Z" fill="#3b82f6" stroke="#0f172a" stroke-width="2"/>
    <!-- Slice 7 (Orange) -->
    <path d="M0 0 L 0 -235 A 235 235 0 0 1 166 -166 Z" fill="#f97316" stroke="#0f172a" stroke-width="2"/>
    <!-- Slice 8 (Teal) -->
    <path d="M0 0 L 166 -166 A 235 235 0 0 1 235 0 Z" fill="#14b8a6" stroke="#0f172a" stroke-width="2"/>

    <!-- Labels on Slices (sampled) -->
    <text transform="translate(140, 60) rotate(22)" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#071018">OM 5 000 F</text>
    <text transform="translate(60, 140) rotate(67)" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#071018">MOMO 10K</text>
    <text transform="translate(-60, 140) rotate(112)" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#071018">PASS 10Go</text>
    <text transform="translate(-140, 60) rotate(157)" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#071018">SUPERMARCHÉ</text>
    <text transform="translate(-140, -60) rotate(202)" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#ffffff">RECHARGE 2K</text>
    <text transform="translate(-60, -140) rotate(247)" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#ffffff">T-SHIRT PRO</text>
    <text transform="translate(60, -140) rotate(292)" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#ffffff">MYSTÈRE</text>
    <text transform="translate(140, -60) rotate(337)" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#071018">JACKPOT</text>

    <!-- Metallic Pegs on Outer Rim -->
