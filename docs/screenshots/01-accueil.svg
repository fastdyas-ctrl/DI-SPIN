    <text x="215" y="37" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Presets</text>
    <text x="295" y="37" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Stats</text>

    <!-- Action Toolbar (Shuffle, Select All, Undo) -->
    <g transform="translate(16, 66)">
      <rect x="0" y="0" width="76" height="28" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="38" y="18" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">🔀 Mélanger</text>

      <rect x="84" y="0" width="76" height="28" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="122" y="18" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">✓ Tout cocher</text>

      <rect x="168" y="0" width="76" height="28" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="206" y="18" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">🗑 Vider</text>

      <rect x="252" y="0" width="76" height="28" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="290" y="18" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">↩ Annuler</text>
