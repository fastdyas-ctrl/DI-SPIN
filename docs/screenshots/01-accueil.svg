      <rect x="10" y="120" width="22" height="22" rx="4" fill="#10b981"/>
      <text x="44" y="135" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Pass Internet 10 Go</text>
      <text x="44" y="147" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Poids : 1x (12.5%)</text>

