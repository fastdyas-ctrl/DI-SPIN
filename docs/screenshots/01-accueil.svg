    <!-- Options List Items -->
    <g transform="translate(16, 110)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="328" height="46" rx="8" fill="#131d33" stroke="#22d3ee" stroke-width="1.2"/>
      <rect x="10" y="12" width="22" height="22" rx="4" fill="#00f0ff"/>
      <text x="44" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Orange Money 5 000 FCFA</text>
      <text x="44" y="39" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Poids : 1x (12.5%)</text>
