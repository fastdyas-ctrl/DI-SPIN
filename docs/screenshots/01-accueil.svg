<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0b1326"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Neon Glows -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Metallic Hub Gradients -->
    <radialGradient id="rimGrad" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="#121e33"/>
      <stop offset="92%" stop-color="#00f0ff"/>
      <stop offset="96%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>

    <radialGradient id="hubGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#cbd5e1"/>
      <stop offset="55%" stop-color="#475569"/>
      <stop offset="85%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid lines -->
  <g opacity="0.08" stroke="#00f0ff" stroke-width="1">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200 M0 420 H1200 M0 480 H1200 M0 540 H1200 M0 600 H1200" />
    <path d="M80 0 V675 M160 0 V675 M240 0 V675 M320 0 V675 M400 0 V675 M480 0 V675 M560 0 V675 M640 0 V675 M720 0 V675 M800 0 V675 M880 0 V675 M960 0 V675 M1040 0 V675 M1120 0 V675" />
  </g>

  <!-- TOP HUD BAR -->
  <rect x="0" y="0" width="1200" height="64" fill="#0d1527" fill-opacity="0.9" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Logo & Title -->
  <g transform="translate(24, 18)">
    <circle cx="14" cy="14" r="14" fill="#00f0ff" fill-opacity="0.2" stroke="#00f0ff" stroke-width="1.5"/>
    <path d="M15 7 L9 16 H14 L13 21 L19 12 H14 Z" fill="#00f0ff"/>
    <text x="36" y="19" font-family="system-ui, sans-serif" font-weight="900" font-size="17" fill="#ffffff" letter-spacing="1">DI SPIN <tspan fill="#00f0ff">ELITE</tspan></text>
    <rect x="156" y="6" width="68" height="18" rx="9" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <text x="190" y="18" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">3G / OFFLINE</text>
  </g>

  <!-- Top HUD Action Buttons -->
