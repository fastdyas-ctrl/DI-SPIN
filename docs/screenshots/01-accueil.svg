      <rect x="10" y="174" width="22" height="22" rx="4" fill="#8b5cf6"/>
      <text x="44" y="189" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Bon d'Achat Supermarché</text>
      <text x="44" y="201" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Poids : 1x (12.5%)</text>

      <!-- Item 5 -->
      <rect x="0" y="216" width="328" height="46" rx="8" fill="#131d33" stroke="#334155" stroke-width="1"/>
      <rect x="10" y="228" width="22" height="22" rx="4" fill="#ec4899"/>
      <text x="44" y="243" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Recharge Crédit 2 000 FCFA</text>
      <text x="44" y="255" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Poids : 1x (12.5%)</text>

      <!-- Item 6 -->
      <rect x="0" y="270" width="328" height="46" rx="8" fill="#131d33" stroke="#334155" stroke-width="1"/>
      <rect x="10" y="282" width="22" height="22" rx="4" fill="#3b82f6"/>
      <text x="44" y="297" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">T-Shirt Collector DI SPIN</text>
      <text x="44" y="309" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Poids : 1x (12.5%)</text>
    </g>

    <!-- Profile Management Footer -->
    <g transform="translate(16, 490)">
      <rect x="0" y="0" width="328" height="52" rx="8" fill="#101a2f" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">PROFIL : Tombola Officielle</text>
      <text x="14" y="38" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">💾 Sauvegardé localement (LocalStorage)</text>
      <rect x="238" y="12" width="76" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="276" y="30" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#cbd5e1" text-anchor="middle">Changer</text>
    </g>
