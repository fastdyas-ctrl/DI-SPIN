      <text x="44" y="81" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">MTN MoMo 10 000 FCFA</text>
      <text x="44" y="93" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Poids : 1x (12.5%)</text>

      <!-- Item 3 -->
