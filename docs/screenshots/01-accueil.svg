    <circle cx="166" cy="166" r="5" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
    <circle cx="0" cy="235" r="5" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
    <circle cx="-166" cy="166" r="5" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
    <circle cx="-235" cy="0" r="5" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
    <circle cx="-166" cy="-166" r="5" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
    <circle cx="0" cy="-235" r="5" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
    <circle cx="166" cy="-166" r="5" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>

    <!-- Central Chrome Hub & Spin Action Button -->
    <circle cx="0" cy="0" r="62" fill="url(#hubGrad)" stroke="#00f0ff" stroke-width="3" filter="url(#glowCyan)"/>
    <circle cx="0" cy="0" r="50" fill="#09101f" stroke="#334155" stroke-width="2"/>
    <path d="M-6 -14 L-12 2 H0 L-4 16 L12 -2 H0 Z" fill="#00f0ff" filter="url(#glowCyan)"/>
    <text x="0" y="32" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#00f0ff" text-anchor="middle" letter-spacing="1.5">TOURNER</text>

    <!-- Spring-Loaded Pointer at 12 o'clock -->
    <g transform="translate(0, -242)">
      <polygon points="0,22 -16,-18 16,-18" fill="#f43f5e" stroke="#ffe4e6" stroke-width="2" filter="url(#glowCyan)"/>
      <circle cx="0" cy="-12" r="5" fill="#ffffff"/>
    </g>
  </g>

  <!-- Bottom Cyber Ticker & Status -->
  <g transform="translate(420, 620)">
    <rect width="740" height="36" rx="8" fill="#0d1527" stroke="#1e293b" stroke-width="1"/>
    <circle cx="20" cy="18" r="4" fill="#10b981"/>
    <text x="36" y="22" font-family="monospace" font-size="12" fill="#38bdf8">AUDIO WEB-API : ACTIF</text>
    <text x="220" y="22" font-family="monospace" font-size="12" fill="#94a3b8">|</text>
    <text x="240" y="22" font-family="monospace" font-size="12" fill="#e2e8f0">LATENCE 3G : OPTIMISÉE (0 requêtes réseau)</text>
    <text x="580" y="22" font-family="monospace" font-size="12" fill="#94a3b8">|</text>
    <text x="600" y="22" font-family="monospace" font-size="12" fill="#10b981">FPS : 60.0</text>
  </g>
</svg>
