    <rect x="0" y="0" width="100" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="50" y="20" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">🎨 Cyber Theme</text>
    
    <!-- Lang Switcher -->
