<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="spinBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0d1b38"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <radialGradient id="motionRadial" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#00f0ff" stop-opacity="0.1"/>
      <stop offset="85%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.6"/>
    </radialGradient>

    <filter id="spinGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="speedBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6 1" result="motionBlur"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#spinBgGrad)"/>

  <!-- Motion Rays Background -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1.5">
    <line x1="600" y1="337" x2="0" y2="50"/>
    <line x1="600" y1="337" x2="150" y2="0"/>
    <line x1="600" y1="337" x2="400" y2="0"/>
    <line x1="600" y1="337" x2="800" y2="0"/>
    <line x1="600" y1="337" x2="1050" y2="0"/>
    <line x1="600" y1="337" x2="1200" y2="60"/>
    <line x1="600" y1="337" x2="1200" y2="300"/>
    <line x1="600" y1="337" x2="1200" y2="550"/>
    <line x1="600" y1="337" x2="1000" y2="675"/>
    <line x1="600" y1="337" x2="600" y2="675"/>
    <line x1="600" y1="337" x2="200" y2="675"/>
    <line x1="600" y1="337" x2="0" y2="550"/>
    <line x1="600" y1="337" x2="0" y2="300"/>
  </g>

  <!-- Live Adrenaline Top Banner -->
  <rect x="0" y="0" width="1200" height="60" fill="#0d1527" stroke="#1e293b" stroke-width="1"/>
  <text x="600" y="38" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#facc15" text-anchor="middle" letter-spacing="3" filter="url(#spinGlow)">
    ⚡ ROTATION EN COURS — ADRENALINE MAXIMALE ! ⚡
  </text>

  <!-- Centered Spinning Wheel with Radial Motion -->
  <g transform="translate(600, 350)">
    <!-- Motion Halo -->
    <circle cx="0" cy="0" r="280" fill="url(#motionRadial)" filter="url(#spinGlow)"/>

    <!-- Outer Speed Ring -->
    <circle cx="0" cy="0" r="255" fill="none" stroke="#00f0ff" stroke-width="3" stroke-dasharray="24 16" opacity="0.8"/>
    <circle cx="0" cy="0" r="248" fill="#09101f" stroke="#0284c7" stroke-width="4"/>

    <!-- Spinning Colored Radial Blades (Blended Motion Blur) -->
    <g filter="url(#speedBlur)">
      <circle cx="0" cy="0" r="240" fill="#0369a1" opacity="0.3"/>
      <!-- Slices undergoing fast rotation -->
      <path d="M0 0 L 235 20 A 235 235 0 0 1 120 200 Z" fill="#00f0ff" opacity="0.75"/>
      <path d="M0 0 L 120 200 A 235 235 0 0 1 -40 230 Z" fill="#f59e0b" opacity="0.75"/>
      <path d="M0 0 L -40 230 A 235 235 0 0 1 -200 120 Z" fill="#10b981" opacity="0.75"/>
      <path d="M0 0 L -200 120 A 235 235 0 0 1 -230 -40 Z" fill="#8b5cf6" opacity="0.75"/>
      <path d="M0 0 L -230 -40 A 235 235 0 0 1 -120 -200 Z" fill="#ec4899" opacity="0.75"/>
      <path d="M0 0 L -120 -200 A 235 235 0 0 1 40 -230 Z" fill="#3b82f6" opacity="0.75"/>
      <path d="M0 0 L 40 -230 A 235 235 0 0 1 200 -120 Z" fill="#f97316" opacity="0.75"/>
      <path d="M0 0 L 200 -120 A 235 235 0 0 1 235 20 Z" fill="#14b8a6" opacity="0.75"/>
    </g>

    <!-- Speed Particle Trails -->
    <circle cx="170" cy="140" r="4" fill="#ffffff" filter="url(#spinGlow)"/>
    <circle cx="-160" cy="150" r="5" fill="#facc15" filter="url(#spinGlow)"/>
    <circle cx="-180" cy="-130" r="4" fill="#38bdf8" filter="url(#spinGlow)"/>
    <circle cx="160" cy="-140" r="6" fill="#f43f5e" filter="url(#spinGlow)"/>

    <!-- Central Hub with Speed Readout -->
    <circle cx="0" cy="0" r="72" fill="#09101f" stroke="#00f0ff" stroke-width="4" filter="url(#spinGlow)"/>
    <text x="0" y="-8" font-family="monospace" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">VITESSE</text>
    <text x="0" y="18" font-family="monospace" font-size="24" font-weight="900" fill="#38bdf8" text-anchor="middle">14.8 rad/s</text>
    <text x="0" y="36" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#10b981" text-anchor="middle">CLUTCH DÉCÉLÉRATION</text>

    <!-- Deflected Spring Pointer (Ticking against pegs!) -->
    <g transform="translate(0, -248) rotate(14)">
      <polygon points="0,28 -18,-16 18,-16" fill="#ef4444" stroke="#ffffff" stroke-width="2" filter="url(#spinGlow)"/>
      <circle cx="0" cy="-8" r="6" fill="#fef08a"/>
      <!-- Audio wave indicator from pointer -->
      <path d="M 24 -4 Q 32 -10 24 -16" fill="none" stroke="#facc15" stroke-width="2"/>
      <path d="M 32 -2 Q 42 -10 32 -18" fill="none" stroke="#facc15" stroke-width="2"/>
      <text x="46" y="-6" font-family="monospace" font-size="10" font-weight="700" fill="#facc15">TICK !</text>
    </g>
  </g>

  <!-- Side Telemetry Card (Physics & Fair RNG) -->
  <g transform="translate(60, 220)">
    <rect width="240" height="230" rx="12" fill="#0d1527" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#38bdf8">Moteur Physique 3D</text>
    <line x1="20" y1="46" x2="220" y2="46" stroke="#1e293b" stroke-width="1"/>
    
    <text x="20" y="75" font-family="monospace" font-size="11" fill="#94a3b8">Frottement : 0.988</text>
    <text x="20" y="105" font-family="monospace" font-size="11" fill="#94a3b8">Énergie : 482 Joules</text>
    <text x="20" y="135" font-family="monospace" font-size="11" fill="#94a3b8">Génération RNG : 100% Client</text>
    <text x="20" y="165" font-family="monospace" font-size="11" fill="#94a3b8">Mode Élimination : Activé</text>
    <rect x="20" y="185" width="200" height="26" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <text x="120" y="202" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#34d399" text-anchor="middle">ZÉRO TRICHE • TIRAGE IMPARTIAL</text>
  </g>

  <!-- Live Audio Synth Waveform -->
  <g transform="translate(900, 220)">
    <rect width="240" height="230" rx="12" fill="#0d1527" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#38bdf8">Synthétiseur Web Audio</text>
    <line x1="20" y1="46" x2="220" y2="46" stroke="#1e293b" stroke-width="1"/>

    <!-- Animated Waveform Bars -->
    <g transform="translate(25, 110)">
      <rect x="0" y="-30" width="10" height="60" rx="3" fill="#00f0ff"/>
      <rect x="18" y="-45" width="10" height="90" rx="3" fill="#38bdf8"/>
      <rect x="36" y="-20" width="10" height="40" rx="3" fill="#0284c7"/>
      <rect x="54" y="-55" width="10" height="110" rx="3" fill="#facc15"/>
      <rect x="72" y="-35" width="10" height="70" rx="3" fill="#f59e0b"/>
      <rect x="90" y="-50" width="10" height="100" rx="3" fill="#10b981"/>
      <rect x="108" y="-25" width="10" height="50" rx="3" fill="#00f0ff"/>
      <rect x="126" y="-40" width="10" height="80" rx="3" fill="#8b5cf6"/>
      <rect x="144" y="-15" width="10" height="30" rx="3" fill="#38bdf8"/>
      <rect x="162" y="-35" width="10" height="70" rx="3" fill="#ec4899"/>
      <rect x="180" y="-10" width="10" height="20" rx="3" fill="#0284c7"/>
    </g>

    <text x="120" y="202" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#94a3b8" text-anchor="middle">Tic mécanique &amp; Whoosh réalistes</text>
  </g>
</svg>
